name: CI

on:
  pull_request:

jobs:
  detect:
    name: Detect affected
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.affected.outputs.tasks }}
      variants: ${{ steps.variants.outputs.variants }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Need the base commit present to diff the PR against it.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Resolve variants
        id: variants
        env:
          VARIANTS: ${{ vars.VARIANTS }}
        run: bun scripts/variant-matrix.ts

      - name: Compute affected packages
        id: affected
        uses: hyoretsu/gh-actions/detect-affected@main
        with:
          tasks: check-types build test:integration test:e2e
          base-sha: ${{ github.event.pull_request.base.sha }}

  build:
    name: "${{ matrix.package }} / Build${{ matrix.variant.suffix }}"
    needs: detect
    env:
      VARIANT: ${{ matrix.variant.slug }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/frontend/src-tauri/target${{ matrix.variant.suffix }}
    if: ${{ fromJSON(needs.detect.outputs.tasks)['build'][0] }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.detect.outputs.variants) }}
        package: ${{ fromJSON(needs.detect.outputs.tasks)['build'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build
        uses: hyoretsu/gh-actions/build@main
        with:
          package: ${{ matrix.package }}

  android:
    name: "frontend / Android build${{ matrix.variant.suffix }}"
    needs: detect
    env:
      VARIANT: ${{ matrix.variant.slug }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/frontend/src-tauri/target${{ matrix.variant.suffix }}
    if: contains(fromJSON(needs.detect.outputs.tasks)['build'], 'frontend')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.detect.outputs.variants) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Android app (debug, unsigned)
        uses: hyoretsu/gh-actions/tauri-android-build@main
        with:
          args: --debug --apk

  check-types:
    name: "${{ matrix.package }} / Type-check${{ matrix.variant.suffix }}"
    needs: detect
    env:
      VARIANT: ${{ matrix.variant.slug }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/frontend/src-tauri/target${{ matrix.variant.suffix }}
    if: ${{ fromJSON(needs.detect.outputs.tasks)['check-types'][0] }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.detect.outputs.variants) }}
        package: ${{ fromJSON(needs.detect.outputs.tasks)['check-types'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check types
        uses: hyoretsu/gh-actions/check-types@main
        with:
          package: ${{ matrix.package }}

  tests:
    needs: detect
    env:
      VARIANT: ${{ matrix.variant.slug }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/frontend/src-tauri/target${{ matrix.variant.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.detect.outputs.variants) }}
        category: [integration, e2e]
        package: [backend, sql]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: docker pull postgres:16 && docker pull redis:7-alpine && docker pull rabbitmq:4-alpine
      - run: bunx turbo run export --filter sql
      - run: bun scripts/test-runner.ts '${{ matrix.package }}' '${{ matrix.category }}'
        if: contains(fromJSON(needs.detect.outputs.tasks)[format('test:{0}', matrix.category)], matrix.package)

  browser:
    name: Frontend browser scenarios${{ matrix.variant.suffix }}
    needs: detect
    env:
      VARIANT: ${{ matrix.variant.slug }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/frontend/src-tauri/target${{ matrix.variant.suffix }}
    if: contains(fromJSON(needs.detect.outputs.tasks)['test:e2e'], 'frontend')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.detect.outputs.variants) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: frontend
      - run: bun -F frontend test:e2e
      - run: bun -F frontend performance:test
