name: CI

on:
  pull_request:

# A newer push supersedes any run still in progress for the same PR.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect affected
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.affected.outputs.tasks }}
      variants: ${{ steps.variants.outputs.variants }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Need the base commit present to diff the PR against it.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Resolve variants
        id: variants
        env:
          VARIANTS: ${{ vars.VARIANTS }}
        run: bun scripts/variant-matrix.ts

      - name: Compute affected packages
        id: affected
        uses: hyoretsu/gh-actions/detect-affected@main
        with:
          tasks: check-types build test:integration test:e2e
          base-sha: ${{ github.event.pull_request.base.sha }}

  build:
    name: "${{ matrix.package }} / Build${{ matrix.variant.suffix }}"
    needs: detect
    env:
      VARIANT: ${{ matrix.variant.slug }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/frontend/src-tauri/target${{ matrix.variant.suffix }}
    if: ${{ fromJSON(needs.detect.outputs.tasks)['build'][0] }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.detect.outputs.variants) }}
        package: ${{ fromJSON(needs.detect.outputs.tasks)['build'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build
        uses: hyoretsu/gh-actions/build@main
        with:
          package: ${{ matrix.package }}

  android:
    name: "frontend / Android build${{ matrix.variant.suffix }}"
    needs: detect
    env:
      VARIANT: ${{ matrix.variant.slug }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/frontend/src-tauri/target${{ matrix.variant.suffix }}
    if: contains(fromJSON(needs.detect.outputs.tasks)['build'], 'frontend')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.detect.outputs.variants) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Tauri validates the bundle identifier before any beforeBuildCommand runs, so the
      # variant branding (including its native identifier) must be prepared first.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies for variant preparation
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prepare variant branding
        run: bunx turbo run variant:prepare --filter frontend --env-mode=loose

      - name: Build Android app (debug, unsigned)
        uses: hyoretsu/gh-actions/tauri-android-build@main
        with:
          args: --debug --apk

  check-types:
    name: "${{ matrix.package }} / Type-check${{ matrix.variant.suffix }}"
    needs: detect
    env:
      VARIANT: ${{ matrix.variant.slug }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/frontend/src-tauri/target${{ matrix.variant.suffix }}
    if: ${{ fromJSON(needs.detect.outputs.tasks)['check-types'][0] }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.detect.outputs.variants) }}
        package: ${{ fromJSON(needs.detect.outputs.tasks)['check-types'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check types
        uses: hyoretsu/gh-actions/check-types@main
        with:
          package: ${{ matrix.package }}

  tests:
    needs: detect
    env:
      VARIANT: ${{ matrix.variant.slug }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/frontend/src-tauri/target${{ matrix.variant.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.detect.outputs.variants) }}
        category: [integration, e2e]
        package: [backend, sql]
    steps:
      - uses: actions/checkout@v5
        if: contains(fromJSON(needs.detect.outputs.tasks)[format('test:{0}', matrix.category)], matrix.package)
      - uses: oven-sh/setup-bun@v2
        if: contains(fromJSON(needs.detect.outputs.tasks)[format('test:{0}', matrix.category)], matrix.package)
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: contains(fromJSON(needs.detect.outputs.tasks)[format('test:{0}', matrix.category)], matrix.package)
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        if: contains(fromJSON(needs.detect.outputs.tasks)[format('test:{0}', matrix.category)], matrix.package)
      # Service images are cached as a tarball instead of being pulled on every job.
      - name: Restore service images
        if: contains(fromJSON(needs.detect.outputs.tasks)[format('test:{0}', matrix.category)], matrix.package)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/docker-images.tar
          key: docker-images-postgres16-redis7-rabbitmq4-v1
      - name: Load or pull service images
        if: contains(fromJSON(needs.detect.outputs.tasks)[format('test:{0}', matrix.category)], matrix.package)
        run: |
          if [ -f ~/docker-images.tar ]; then
            docker load -i ~/docker-images.tar
          else
            docker pull postgres:16 & docker pull redis:7-alpine & docker pull rabbitmq:4-alpine & wait
            docker save -o ~/docker-images.tar postgres:16 redis:7-alpine rabbitmq:4-alpine
          fi
      - run: bunx turbo run export --filter sql
        if: contains(fromJSON(needs.detect.outputs.tasks)[format('test:{0}', matrix.category)], matrix.package)
      - run: bun scripts/test-runner.ts '${{ matrix.package }}' '${{ matrix.category }}'
        if: contains(fromJSON(needs.detect.outputs.tasks)[format('test:{0}', matrix.category)], matrix.package)

  browser:
    name: Frontend browser scenarios${{ matrix.variant.suffix }}
    needs: detect
    env:
      VARIANT: ${{ matrix.variant.slug }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/frontend/src-tauri/target${{ matrix.variant.suffix }}
    if: contains(fromJSON(needs.detect.outputs.tasks)['test:e2e'], 'frontend')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.detect.outputs.variants) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        working-directory: frontend
      - run: bunx playwright install-deps chromium
        if: steps.playwright.outputs.cache-hit == 'true'
        working-directory: frontend
      - run: bun -F frontend test:e2e
      - run: bun -F frontend performance:test
