name: template-production
x-runtime: &runtime
  env_file: .env
  restart: unless-stopped
x-backend-image: &backend-image ${BACKEND_IMAGE:-ghcr.io/owner/repository_backend:latest}
x-after-migrate: &after-migrate
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  migrate:
    env_file: .env
    image: *backend-image
    restart: "no"
    working_dir: /app/packages/sql
    command: ["bun", "run", "migrate:deploy"]
  api:
    <<: [*runtime, *after-migrate]
    image: *backend-image
    ports: ["127.0.0.1:3333:3333"]
  worker:
    <<: [*runtime, *after-migrate]
    image: ${WORKER_IMAGE:?Set WORKER_IMAGE}
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
