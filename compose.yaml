name: template

services:
  dev:
    image: oven/bun:latest
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    init: true
    environment:
      BUN_INSTALL_CACHE_DIR: /bun-cache
      HOME: /tmp
    volumes:
      - .:/app
      - ${BUN_INSTALL_CACHE_DIR:-${HOME}/.bun/install/cache}:/bun-cache
    entrypoint: ["sh", "-ec"]
    command:
      - |
        date +%s > /tmp/template-dev-started-at
        echo 0 > /tmp/template-dev-health-failures
        sh /app/scripts/dev-migration-watch.sh &
        bun install --frozen-lockfile
        bunx turbo run export --filter sql
        bun -F sql migrate:deploy
        exec bun dev
    healthcheck:
      test: ["CMD", "sh", "/app/scripts/dev-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    restart: unless-stopped
    networks:
      - proxy
    labels:
      caddy_1: template.hyoretsu.com
      caddy_1.reverse_proxy: "{{upstreams 5173}}"

      caddy_2: template-api.hyoretsu.com
      caddy_2.reverse_proxy: "{{upstreams 3333}}"

networks:
  proxy:
    external: true
